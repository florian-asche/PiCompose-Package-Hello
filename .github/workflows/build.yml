name: Build and publish

on:
  push:
    branches:
      - '**'
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package
    if: >-
      (github.event_name != 'release' || !github.event.release.prerelease) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    uses: florian-asche/PiCompose-Repository/.github/workflows/package-build.yml@main
    permissions:
      contents: write
    secrets:
      hub-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
