name: Build and publish

on:
  push:
    branches:
      - main
      - test
  release:
    types: [published]
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Package
    if: github.event_name != 'release' || !github.event.release.prerelease
    uses: florian-asche/PiCompose-Repository/.github/workflows/package-build.yml@main
    permissions:
      contents: write
    secrets:
      hub-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
