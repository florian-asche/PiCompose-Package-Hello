name: Build and publish

on:
  push:
    branches:
      - main
      - test
    tags:
      - 'v[0-9]*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Package
    uses: florian-asche/PiCompose-Repository/.github/workflows/package-build.yml@main
    permissions:
      contents: write
    secrets:
      hub-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
